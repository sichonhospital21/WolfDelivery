<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Delivery - สั่งเดลิเวอรี่ด่วน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#121212] text-gray-100 min-h-screen py-8 px-4">
    
    <div class="max-w-md mx-auto bg-[#1E1E1E] border border-orange-500/30 rounded-2xl shadow-2xl overflow-hidden p-6 md:p-8">
        
        <!-- Header / โลโก้แบรนด์ -->
        <div class="text-center mb-6">
            <div class="inline-block bg-gradient-to-r from-orange-500 to-amber-600 p-3 rounded-full shadow-lg shadow-orange-600/30 mb-3">
                <!-- ไอคอนหัวหมาป่า/มอเตอร์ไซค์ -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-black font-bold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-wider text-white">WOLF <span class="text-orange-500">DELIVERY</span></h1>
            <p class="text-sm text-orange-400 mt-1 font-medium">🐺 บริการส่งด่วน ส่งไว ใจถึงใจ | เปิด 08.00 - 21.30 น.</p>
        </div>
        
        <!-- ฟอร์มสั่งซื้อ -->
        <form id="orderForm" class="space-y-4">
            <div>
                <label class="block text-gray-300 font-semibold text-sm mb-1">ชื่อผู้สั่ง:</label>
                <input type="text" id="customerName" required placeholder="ระบุชื่อของคุณ..." 
                    class="w-full bg-[#2A2A2A] border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition">
            </div>
            
            <div>
                <label class="block text-gray-300 font-semibold text-sm mb-1">เบอร์โทรศัพท์:</label>
                <input type="tel" id="phone" required placeholder="08xxxxxxxx" 
                    class="w-full bg-[#2A2A2A] border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition">
            </div>
            
            <div>
                <label class="block text-gray-300 font-semibold text-sm mb-1">ที่อยู่จัดส่ง:</label>
                <textarea id="address" rows="3" required placeholder="บ้านเลขที่, จุดสังเกต, หรือพิกัด..." 
                    class="w-full bg-[#2A2A2A] border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition"></textarea>
            </div>
            
            <div>
                <label class="block text-gray-300 font-semibold text-sm mb-1">รายการอาหาร / สินค้า:</label>
                <textarea id="orderDetails" rows="3" required placeholder="ระบุรายการสินค้าและจำนวนที่ต้องการสั่ง..." 
                    class="w-full bg-[#2A2A2A] border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition"></textarea>
            </div>
            
            <div>
                <label class="block text-gray-300 font-semibold text-sm mb-1">ยอดรวม (บาท) <span class="text-xs text-orange-400 font-normal">(ค่าส่งเริ่มต้น 20.-)</span>:</label>
                <input type="number" id="totalPrice" required placeholder="0.00" 
                    class="w-full bg-[#2A2A2A] border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition">
            </div>
            
            <button type="submit" id="submitBtn" 
                class="w-full bg-gradient-to-r from-orange-500 to-amber-600 text-black font-bold p-3.5 rounded-xl hover:from-orange-400 hover:to-amber-500 shadow-lg shadow-orange-600/30 transition transform active:scale-95">
                🚀 ยืนยันการสั่งซื้อ
            </button>
        </form>
        
        <div id="resultMsg" class="mt-4 text-center font-medium text-sm"></div>
        
        <div class="mt-8 text-center border-t border-gray-800 pt-4 text-xs text-gray-500">
            Wolf Delivery System © 2026
        </div>
    </div>

    <script>
        // ⚠️ อย่าลืมใส่ URL Google Apps Script ของคุณกานต์ตรงนี้ครับ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxETEHAUyNCZ-5l1k7-5x3OzX2gxAMbTu53kHV1_NPeTR74_ZS7x-fU7W8qIQYAQVw_Gw/exec";

        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('resultMsg');
            
            btn.disabled = true;
            btn.innerText = "กำลังส่งออเดอร์...";
            
            const data = {
                customerName: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                orderDetails: document.getElementById('orderDetails').value,
                totalPrice: document.getElementById('totalPrice').value
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                msg.className = "mt-4 text-center font-medium text-green-400";
                msg.innerText = "🎉 ส่งออเดอร์สำเร็จ! ไรเดอร์เตรียมลุยแล้วครับ";
                document.getElementById('orderForm').reset();
            } catch (error) {
                msg.className = "mt-4 text-center font-medium text-red-400";
                msg.innerText = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 ยืนยันการสั่งซื้อ";
            }
        });
    </script>
</body>
</html>
